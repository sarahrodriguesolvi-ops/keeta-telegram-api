<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Keeta - Formulário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .section-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 25px 0 20px 0;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            display: none;
            font-size: 15px;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required::after {
            content: " *";
            color: #e74c3c;
        }

        .api-config {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .api-config label {
            margin-bottom: 10px;
        }

        .api-config input {
            font-family: monospace;
            font-size: 13px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Cadastro de Loja Keeta</h1>
            <p>Preencha os dados do restaurante para cadastro na plataforma</p>
        </div>

        <div class="api-config">
            <label>🔗 URL da API:</label>
            <input type="text" id="apiUrl" value="https://keeta-telegram-api-production.up.railway.app/api/enviar-cadastro" placeholder="URL da API">
        </div>

        <form id="cadastroForm">
            <div class="section-title">📊 Informações Gerais</div>
            <div class="row">
                <div class="form-group">
                    <label>ID do Cliente</label>
                    <input type="text" id="idCliente" placeholder="Ex: 51137965">
                </div>
                <div class="form-group">
                    <label>Vendedor</label>
                    <input type="text" id="vendedor" placeholder="Ex: Heraclito">
                </div>
            </div>

            <div class="section-title">🏪 Dados do Restaurante</div>
            <div class="form-group">
                <label class="required">Nome do Restaurante</label>
                <input type="text" id="restaurante" placeholder="Ex: Santa Arepa" required>
            </div>
            <div class="form-group">
                <label>Razão Social</label>
                <input type="text" id="razaoSocial" placeholder="Ex: Alexandra Arciniegas Gutierrez ME">
            </div>

            <div class="section-title">👤 Proprietário e Contatos</div>
            <div class="form-group">
                <label class="required">Proprietário</label>
                <input type="text" id="proprietario" placeholder="Ex: Alexandra" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Tel. Proprietário</label>
                    <input type="tel" id="telProprietario" placeholder="(48) 98866-9947">
                </div>
                <div class="form-group">
                    <label>Tel. Loja</label>
                    <input type="tel" id="telLoja" placeholder="(48) 8880-3367">
                </div>
            </div>

            <div class="section-title">📄 Documentos</div>
            <div class="row">
                <div class="form-group">
                    <label class="required">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="60.453.207/0001-43" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="802.448.169-30">
                </div>
            </div>

            <div class="section-title">🏦 Dados Bancários</div>
            <div class="row">
                <div class="form-group">
                    <label>Banco</label>
                    <input type="text" id="banco" placeholder="197">
                </div>
                <div class="form-group">
                    <label>Agência</label>
                    <input type="text" id="agencia" placeholder="1">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Conta</label>
                    <input type="text" id="conta" placeholder="31775638-5">
                </div>
                <div class="form-group">
                    <label>Titular</label>
                    <input type="text" id="titular" placeholder="Alexandra Arciniegas Gutierrez">
                </div>
            </div>

            <div class="section-title">💻 Sistema e Taxas</div>
            <div class="row">
                <div class="form-group">
                    <label>Sistema</label>
                    <select id="sistema">
                        <option value="">Selecione...</option>
                        <option value="iFood">iFood</option>
                        <option value="Keeta">Keeta</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Taxa Keeta</label>
                    <input type="text" id="taxaKeeta" placeholder="12%">
                </div>
            </div>
            <div class="form-group">
                <label>Taxa iFood</label>
                <input type="text" id="taxaIfood" placeholder="18%">
            </div>

            <div class="section-title">📝 Observações</div>
            <div class="form-group">
                <textarea id="observacoes" rows="4" placeholder="Observações adicionais sobre o cadastro..."></textarea>
            </div>

            <button type="submit" id="btnEnviar">
                <span>📨 Enviar Cadastro para Telegram</span>
            </button>
        </form>

        <div id="resultado" class="result"></div>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviar');
            const resultado = document.getElementById('resultado');
            const btnText = btn.querySelector('span');
            
            // Desabilitar botão e mostrar loading
            btn.disabled = true;
            btnText.innerHTML = '<div class="loading"></div> Enviando...';
            resultado.style.display = 'none';

            // Coletar dados do formulário
            const dados = {
                idCliente: document.getElementById('idCliente').value,
                vendedor: document.getElementById('vendedor').value,
                restaurante: document.getElementById('restaurante').value,
                razaoSocial: document.getElementById('razaoSocial').value,
                proprietario: document.getElementById('proprietario').value,
                telProprietario: document.getElementById('telProprietario').value,
                telLoja: document.getElementById('telLoja').value,
                cnpj: document.getElementById('cnpj').value,
                cpf: document.getElementById('cpf').value,
                banco: document.getElementById('banco').value,
                agencia: document.getElementById('agencia').value,
                conta: document.getElementById('conta').value,
                titular: document.getElementById('titular').value,
                sistema: document.getElementById('sistema').value,
                taxaKeeta: document.getElementById('taxaKeeta').value,
                taxaIfood: document.getElementById('taxaIfood').value,
                observacoes: document.getElementById('observacoes').value
            };

            try {
                const apiUrl = document.getElementById('apiUrl').value;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                resultado.style.display = 'block';
                if (data.success) {
                    resultado.className = 'result success';
                    resultado.innerHTML = `
                        <strong>✅ Sucesso!</strong><br>
                        ${data.message}<br>
                        <small>Message ID: ${data.telegramMessageId}</small>
                    `;
                    document.getElementById('cadastroForm').reset();
                } else {
                    resultado.className = 'result error';
                    resultado.innerHTML = `
                        <strong>❌ Erro!</strong><br>
                        ${data.message}
                    `;
                }
            } catch (error) {
                resultado.style.display = 'block';
                resultado.className = 'result error';
                resultado.innerHTML = `
                    <strong>❌ Erro de conexão!</strong><br>
                    Verifique se a URL da API está correta.<br>
                    <small>${error.message}</small>
                `;
            } finally {
                btn.disabled = false;
                btnText.innerHTML = '<span>📨 Enviar Cadastro para Telegram</span>';
            }
        });

        // Máscara para CNPJ
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 14) {
                value = value.replace(/^(\d{2})(\d)/, '$1.$2');
                value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
                value = value.replace(/(\d{4})(\d)/, '$1-$2');
            }
            e.target.value = value;
        });

        // Máscara para CPF
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/^(\d{3})(\d)/, '$1.$2');
                value = value.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
                value = value.replace(/\.(\d{3})(\d)/, '.$1-$2');
            }
            e.target.value = value;
        });

        // Máscara para telefone
        ['telProprietario', 'telLoja'].forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length <= 11) {
                    value = value.replace(/^(\d{2})(\d)/, '($1) $2');
                    value = value.replace(/\((\d{2})\) (\d{5})(\d)/, '($1) $2-$3');
                }
                e.target.value = value;
            });
        });
    </script>
</body>
</html>
