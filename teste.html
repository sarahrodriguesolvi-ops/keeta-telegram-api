<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - API Keeta Telegram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .section-title {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 20px 0 15px 0;
            font-weight: 700;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .api-url {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .api-url label {
            margin-bottom: 8px;
        }
        .required::after {
            content: " *";
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Teste de Envio - Keeta Telegram</h1>
        <p class="subtitle">Preencha o formulário para testar o envio para o Telegram</p>

        <div class="api-url">
            <label>URL da API:</label>
            <input type="text" id="apiUrl" value="http://localhost:3000/api/enviar-cadastro" placeholder="http://localhost:3000/api/enviar-cadastro">
        </div>

        <form id="cadastroForm">
            <div class="section-title">📊 Informações Gerais</div>
            <div class="row">
                <div class="form-group">
                    <label>ID do Cliente</label>
                    <input type="text" id="idCliente" placeholder="Ex: 51137965">
                </div>
                <div class="form-group">
                    <label>Vendedor</label>
                    <input type="text" id="vendedor" placeholder="Ex: Heraclito">
                </div>
            </div>

            <div class="section-title">🏪 Dados do Restaurante</div>
            <div class="form-group">
                <label class="required">Nome do Restaurante</label>
                <input type="text" id="restaurante" placeholder="Ex: Santa Arepa" required>
            </div>
            <div class="form-group">
                <label>Razão Social</label>
                <input type="text" id="razaoSocial" placeholder="Ex: Alexandra Arciniegas Gutierrez">
            </div>

            <div class="section-title">👤 Proprietário e Contatos</div>
            <div class="form-group">
                <label class="required">Proprietário</label>
                <input type="text" id="proprietario" placeholder="Ex: Alexandra" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Tel. Proprietário</label>
                    <input type="text" id="telProprietario" placeholder="(48) 98866-9947">
                </div>
                <div class="form-group">
                    <label>Tel. Loja</label>
                    <input type="text" id="telLoja" placeholder="(48) 8880-3367">
                </div>
            </div>

            <div class="section-title">📄 Documentos</div>
            <div class="row">
                <div class="form-group">
                    <label class="required">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="60.453.207/0001-43" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="802.448.169-30">
                </div>
            </div>

            <div class="section-title">🏦 Dados Bancários</div>
            <div class="row">
                <div class="form-group">
                    <label>Banco</label>
                    <input type="text" id="banco" placeholder="197">
                </div>
                <div class="form-group">
                    <label>Agência</label>
                    <input type="text" id="agencia" placeholder="1">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Conta</label>
                    <input type="text" id="conta" placeholder="31775638-5">
                </div>
                <div class="form-group">
                    <label>Titular</label>
                    <input type="text" id="titular" placeholder="Alexandra Arciniegas Gutierrez">
                </div>
            </div>

            <div class="section-title">💻 Sistema e Taxas</div>
            <div class="row">
                <div class="form-group">
                    <label>Sistema</label>
                    <select id="sistema">
                        <option value="">Selecione...</option>
                        <option value="iFood">iFood</option>
                        <option value="Keeta">Keeta</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Taxa Keeta</label>
                    <input type="text" id="taxaKeeta" placeholder="12%">
                </div>
            </div>
            <div class="form-group">
                <label>Taxa iFood</label>
                <input type="text" id="taxaIfood" placeholder="18%">
            </div>

            <div class="section-title">📝 Observações</div>
            <div class="form-group">
                <textarea id="observacoes" rows="3" placeholder="Observações adicionais..."></textarea>
            </div>

            <button type="submit" id="btnEnviar">📨 Enviar para Telegram</button>
        </form>

        <div id="resultado" class="result"></div>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviar');
            const resultado = document.getElementById('resultado');
            
            btn.disabled = true;
            btn.textContent = '📨 Enviando...';
            resultado.style.display = 'none';

            const dados = {
                idCliente: document.getElementById('idCliente').value,
                vendedor: document.getElementById('vendedor').value,
                restaurante: document.getElementById('restaurante').value,
                razaoSocial: document.getElementById('razaoSocial').value,
                proprietario: document.getElementById('proprietario').value,
                telProprietario: document.getElementById('telProprietario').value,
                telLoja: document.getElementById('telLoja').value,
                cnpj: document.getElementById('cnpj').value,
                cpf: document.getElementById('cpf').value,
                banco: document.getElementById('banco').value,
                agencia: document.getElementById('agencia').value,
                conta: document.getElementById('conta').value,
                titular: document.getElementById('titular').value,
                sistema: document.getElementById('sistema').value,
                taxaKeeta: document.getElementById('taxaKeeta').value,
                taxaIfood: document.getElementById('taxaIfood').value,
                observacoes: document.getElementById('observacoes').value
            };

            try {
                const apiUrl = document.getElementById('apiUrl').value;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                resultado.style.display = 'block';
                if (data.success) {
                    resultado.className = 'result success';
                    resultado.innerHTML = `✅ <strong>Sucesso!</strong><br>${data.message}<br><small>Message ID: ${data.telegramMessageId}</small>`;
                    document.getElementById('cadastroForm').reset();
                } else {
                    resultado.className = 'result error';
                    resultado.innerHTML = `❌ <strong>Erro!</strong><br>${data.message}`;
                }
            } catch (error) {
                resultado.style.display = 'block';
                resultado.className = 'result error';
                resultado.innerHTML = `❌ <strong>Erro de conexão!</strong><br>Verifique se a API está rodando.<br><small>${error.message}</small>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '📨 Enviar para Telegram';
            }
        });
    </script>
</body>
</html>
